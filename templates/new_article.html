<!DOCTYPE html>
<html>
<head>
    <title>Write New Article</title>
</head>
<body>
    <h1>✍️ Write a New Article</h1>
    
    <form action="/new-article" method="POST">
        <label>Article Title:</label><br>
        <input type="text" name="title" placeholder="Enter title..." required><br><br>
        
        <label>Content:</label><br>
        <textarea name="content" placeholder="Write your article..." required></textarea><br><br>
        
        <label>Author Name:</label><br>
        <input type="text" name="author" placeholder="Your name..." required><br><br>
        
        <button type="submit">Publish Article</button>
    </form>
    
    <br>
    <a href="/">← Back to Home</a>
</body>
</html>
