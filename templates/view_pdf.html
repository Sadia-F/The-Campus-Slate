<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Issue — The Campus Slate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="pdf-header">
        <div class="logo"><span class="red">The</span> Campus <span class="red">Slate</span></div>
        <div class="nav-links">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <div class="pdf-container">
        <div class="pdf-viewer">
            <iframe src="{{ pdf_url }}#toolbar=1&navpanes=1&scrollbar=1&view=Fit"
                    type="application/pdf"
                    title="PDF Viewer">
                <div class="fallback-message">
                    <div class="icon">📄</div>
                    <h3>PDF Viewer Not Available</h3>
                    <p>Your browser cannot display PDFs directly.</p>
                    <a href="{{ pdf_url }}" class="download-link" target="_blank" download>
                        📥 Download PDF
                    </a>
                </div>
            </iframe>
        </div>
    </div>
</body>
</html>
