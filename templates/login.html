{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="lock-icon">🔒</div>
    <div class="logo"><span class="red">The</span> Campus <span class="red">Slate</span></div>
    <div class="subtitle">Team Member Login</div>

    <form action="/login" method="POST">
        <input type="password" name="password" placeholder="Enter team password..." required autofocus>
        <button type="submit" class="btn">🔑 Log In</button>
    </form>

    <a href="/" class="back-link">← Back to Home</a>
</div>
{% endblock %}
